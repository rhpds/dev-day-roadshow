apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-theme-properties
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "10"
data:
  theme.properties: |
    parent=keycloak.v2
    import=common/keycloak
    styles=css/styles.css css/custom.css
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-theme-css
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "10"
data:
  custom.css: |
    body#keycloak-bg {
      background: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)),
        url("../img/custom-bg.jpg") no-repeat center center fixed !important;
      background-size: cover !important;
    }
binaryData:
  custom-bg.jpg: {{ .Files.Get "files/sso-bg.jpg" | b64enc }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: keycloak-theme-setup
  namespace: {{ .Values.argocd.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "10"
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: keycloak-theme-setup
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "10"
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["keycloak-initial-admin"]
    verbs: ["get"]
  - apiGroups: ["k8s.keycloak.org"]
    resources: ["keycloaks"]
    resourceNames: ["keycloak"]
    verbs: ["get", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: keycloak-theme-setup
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "10"
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
subjects:
  - kind: ServiceAccount
    name: keycloak-theme-setup
    namespace: {{ .Values.argocd.namespace }}
roleRef:
  kind: Role
  name: keycloak-theme-setup
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-theme-setup
  namespace: {{ .Values.argocd.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "10"
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 5
  template:
    spec:
      serviceAccountName: keycloak-theme-setup
      restartPolicy: OnFailure
      containers:
        - name: setup
          image: {{ .Values.jobAnsibleImage }}
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              REALM="sso"
              SSO_URL="https://keycloak.keycloak.svc:8443"

              # ---- Patch Keycloak CR with theme volume mounts ----
              echo "Patching Keycloak CR with custom theme mounts..."
              oc patch keycloak keycloak -n keycloak --type merge -p '{
                "spec": {
                  "additionalOptions": [
                    {"name": "enable-recovery", "value": "true"},
                    {"name": "spi-theme-cache-themes", "value": "false"}
                  ],
                  "unsupported": {
                    "podTemplate": {
                      "spec": {
                        "containers": [{
                          "volumeMounts": [
                            {"name": "theme-properties", "mountPath": "/opt/keycloak/themes/custom-login/login/theme.properties", "subPath": "theme.properties"},
                            {"name": "theme-css", "mountPath": "/opt/keycloak/themes/custom-login/login/resources/css/custom.css", "subPath": "custom.css"},
                            {"name": "theme-css", "mountPath": "/opt/keycloak/themes/custom-login/login/resources/img/custom-bg.jpg", "subPath": "custom-bg.jpg"}
                          ]
                        }],
                        "volumes": [
                          {"name": "theme-properties", "configMap": {"name": "keycloak-theme-properties"}},
                          {"name": "theme-css", "configMap": {"name": "keycloak-theme-css"}}
                        ]
                      }
                    }
                  }
                }
              }'

              # ---- Wait for Keycloak to restart with new mounts ----
              echo "Waiting for Keycloak to restart..."
              sleep 10
              until oc get pods -n keycloak -l app=keycloak -o jsonpath='{.items[0].status.containerStatuses[0].ready}' 2>/dev/null | grep -q true; do
                sleep 5
              done

              echo "Waiting for Keycloak API..."
              for i in $(seq 1 30); do
                HTTP=$(curl -sk -o /dev/null -w "%{http_code}" "${SSO_URL}/realms/${REALM}/.well-known/openid-configuration") || true
                if [ "$HTTP" = "200" ]; then break; fi
                echo "  Attempt ${i}/30..."
                sleep 10
              done

              # ---- Set loginTheme via API ----
              ADMIN_USER=$(oc get secret keycloak-initial-admin -n keycloak -o jsonpath='{.data.username}' | base64 -d)
              ADMIN_PASS=$(oc get secret keycloak-initial-admin -n keycloak -o jsonpath='{.data.password}' | base64 -d)
              TOKEN=$(curl -sk "${SSO_URL}/realms/master/protocol/openid-connect/token" \
                -d "grant_type=password&client_id=admin-cli&username=${ADMIN_USER}&password=${ADMIN_PASS}" | \
                python3 -c "import sys,json; print(json.load(sys.stdin).get('access_token',''))")

              if [ -z "${TOKEN}" ]; then
                echo "ERROR: could not get Keycloak admin token"
                exit 1
              fi

              curl -sk -X PUT "${SSO_URL}/admin/realms/${REALM}" \
                -H "Authorization: Bearer ${TOKEN}" \
                -H "Content-Type: application/json" \
                -d '{"loginTheme": "custom-login"}'

              echo "SSO login theme set to custom-login"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi

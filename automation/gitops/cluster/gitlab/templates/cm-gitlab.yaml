apiVersion: v1
data:
  DB_ADAPTER: postgresql
  DB_HOST: gitlab-postgresql.gitlab.svc
  DB_NAME: {{ $.Values.postgresql.dbName }}
  DB_PORT: "5432"
  DB_USER: {{ $.Values.postgresql.dbUser }}
  GITLAB_BACKUP_SCHEDULE: daily
  GITLAB_BACKUP_TIME: "04:30"
  GITLAB_EMAIL: {{ $.Values.gitlab.email.address }}
  GITLAB_EMAIL_DISPLAY_NAME: {{ $.Values.gitlab.email.displayName }}
  GITLAB_EMAIL_REPLY_TO: {{ $.Values.gitlab.email.replyTo }}
  GITLAB_HOST: {{ $.Values.gitlab.host }}
  GITLAB_HTTPS: "{{ $.Values.gitlab.https }}"
  GITLAB_NOTIFY_ON_BROKEN_BUILDS: "true"
  GITLAB_NOTIFY_PUSHER: "false"
  GITLAB_PIPELINE_SCHEDULE_WORKER_CRON: '*/5 * * * *'
  GITLAB_PORT: "443"
  GITLAB_ROOT_EMAIL: {{ $.Values.gitlab.rootEmail }}
  GITLAB_SSH_HOST: {{ $.Values.gitlab.ssh.host }}
  GITLAB_SSH_PORT: "{{ $.Values.gitlab.ssh.port }}"
  GITLAB_TIMEZONE: Berlin
  NGINX_MAX_UPLOAD_SIZE: 100m
  {{- if .Values.keycloak.host }}
  OAUTH_ENABLED: "true"
  OAUTH_ALLOW_SSO: "openid_connect"
  OAUTH_BLOCK_AUTO_CREATED_USERS: "false"
  OAUTH_AUTO_LINK_USER: "openid_connect"
  OAUTH_AUTO_SIGN_IN_WITH_PROVIDER: "oidc"
  OAUTH_OIDC_LABEL: "SSO Login"
  OAUTH_OIDC_ISSUER: "https://{{ .Values.keycloak.host }}/realms/{{ .Values.keycloak.realm }}"
  OAUTH_OIDC_CLIENT_ID: {{ .Values.keycloak.clientId | quote }}
  OAUTH_OIDC_DISCOVERY: "true"
  OAUTH_OIDC_SCOPE: "openid profile email"
  OAUTH_OIDC_RESPONSE_TYPE: "code"
  OAUTH_OIDC_CLIENT_AUTH_METHOD: "client_secret_post"
  OAUTH_OIDC_UID_FIELD: "preferred_username"
  OAUTH_OIDC_SEND_SCOPE_TO_TOKEN_EP: "true"
  OAUTH_OIDC_REDIRECT_URI: "https://{{ .Values.gitlab.host }}/users/auth/openid_connect/callback"
  {{- end }}
  REDIS_HOST: gitlab-redis.gitlab.svc
  REDIS_PORT: "6379"
  SMTP_AUTHENTICATION: login
  SMTP_DOMAIN: {{ $.Values.gitlab.smtp.domain }}
  SMTP_ENABLED: "{{ $.Values.gitlab.smtp.enabled }}"
  SMTP_HOST: {{ $.Values.gitlab.smtp.host }}
  SMTP_PORT: "{{ $.Values.gitlab.smtp.port }}"
  SMTP_STARTTLS: "true"
  SMTP_USER: {{ $.Values.gitlab.smtp.user }}
  TZ: Europe/Berlin
kind: ConfigMap
metadata:
  labels:
    app: gitlab
  name: gitlab-cm
  annotations:
    argocd.argoproj.io/sync-wave: "0"

kind: ConfigMap
metadata:
  name:  cm-create-root-pat
  annotations:
    argocd.argoproj.io/sync-wave: "1"
apiVersion: v1
data:
  create-root-pat.sh: |
    #!/bin/bash
    set -e
    
    echo -n "token = User.find(1).personal_access_tokens.create(name: 'apitoken', impersonation: false, expires_at: 365.days.from_now, scopes: [:api]); token.save!; token_value = token.token; File.open('/tmp/root.pat', 'w', 0600) { |file| file.write(token_value) }" | ./bin/rails console
{{- if .Values.keycloak.host }}
  fix-oidc-provider-name.sh: |
    #!/bin/bash
    # The sameersbn entrypoint writes auto_sign_in_with_provider: oidc
    # but GitLab routing needs "openid_connect". Wait for the entrypoint
    # to generate gitlab.yml, then patch it before puma starts.
    until grep -q 'auto_sign_in_with_provider: oidc' /home/git/gitlab/config/gitlab.yml 2>/dev/null; do
      sleep 1
    done
    sed -i 's/auto_sign_in_with_provider: oidc/auto_sign_in_with_provider: openid_connect/' /home/git/gitlab/config/gitlab.yml
{{- end }}

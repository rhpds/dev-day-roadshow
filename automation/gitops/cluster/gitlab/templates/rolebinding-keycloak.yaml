{{- if .Values.keycloak.host }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gitlab-keycloak-read
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "2"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["keycloak-initial-admin"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gitlab-keycloak-read
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gitlab-keycloak-read
subjects:
  - kind: ServiceAccount
    name: gitlab
    namespace: {{ .Release.Namespace }}
{{- end }}

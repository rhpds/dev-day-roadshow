# The Pipelines operator creates a TektonConfig CR with coschedule set to
# "workspaces" by default. This mode rejects any task that binds more than one
# PVC, which breaks tasks like sonar-scan that need both a source and a
# maven-cache workspace. This PostSync Job patches TektonConfig to use
# "pipelineruns" mode, which still handles node affinity across the pipeline
# run but allows individual tasks to mount multiple PVCs.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tektonconfig-patch
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tektonconfig-patch
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
rules:
  - apiGroups: ["operator.tekton.dev"]
    resources: ["tektonconfigs"]
    verbs: ["get", "patch"]
  - apiGroups: ["operator.openshift.io"]
    resources: ["consoles"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tektonconfig-patch
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tektonconfig-patch
subjects:
  - kind: ServiceAccount
    name: tektonconfig-patch
    namespace: {{ .Release.Namespace }}
# Results configuration is namespaced. Keep these permissions out of the
# ClusterRole: this hook only updates this ConfigMap and restarts Results pods
# in the Pipelines namespace. Without them, set -e exits before Chains setup.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tektonconfig-patch-results
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["tekton-results-api-config"]
    verbs: ["get", "update"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["chains-config"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["tekton-chains-controller"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tektonconfig-patch-results
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tektonconfig-patch-results
subjects:
  - kind: ServiceAccount
    name: tektonconfig-patch
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: tektonconfig-patch
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 5
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: tektonconfig-patch
      containers:
        - name: patch
          image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail

              echo "Waiting for TektonConfig to exist..."
              until oc get tektonconfig config > /dev/null 2>&1; do
                sleep 5
              done

              # Allow multiple PVCs per task pod. The default "workspaces" mode
              # rejects tasks that bind more than one PVC (e.g. sonar-scan with
              # source + maven-cache).
              oc patch tektonconfig config --type merge \
                -p '{"spec":{"pipeline":{"coschedule":"pipelineruns"}}}'
              echo "Pipeline config patched"

              # Disable Results API auth. The default auth mode rejects
              # non-admin OAuth tokens, breaking the Pipelines console
              # overview page for workshop users. The console proxy
              # still handles user authentication.
              oc get cm tekton-results-api-config -n openshift-pipelines -o json | \
                python3 -c "
              import sys, json
              d = json.load(sys.stdin)
              d['data']['config'] = d['data']['config'].replace('AUTH_DISABLE=false', 'AUTH_DISABLE=true')
              json.dump(d, sys.stdout)
              " | oc replace -f -
              oc delete pod -n openshift-pipelines -l app.kubernetes.io/name=tekton-results-api --wait=false
              echo "Results API auth disabled"

              # Configure Tekton Chains for keyless signing via TAS Fulcio/Rekor.
              # The Chains controller uses its projected SA token (audience:
              # trusted-artifact-signer) to obtain a short-lived signing cert
              # from Fulcio, and logs signatures to Rekor for transparency.
              FULCIO_URL="http://fulcio-server.trusted-artifact-signer.svc"
              REKOR_URL="http://rekor-server.trusted-artifact-signer.svc"

              oc patch tektonconfig config --type merge -p '{
                "spec": {
                  "chain": {
                    "signers.x509.fulcio.enabled": true,
                    "signers.x509.fulcio.address": "'"${FULCIO_URL}"'",
                    "signers.x509.fulcio.issuer": "https://kubernetes.default.svc",
                    "signers.x509.identity.token.file": "/var/run/sigstore/cosign/oidc-token",
                    "transparency.enabled": true,
                    "transparency.url": "'"${REKOR_URL}"'",
                    "artifacts.pipelinerun.format": "in-toto",
                    "artifacts.pipelinerun.storage": "oci",
                    "artifacts.taskrun.format": "in-toto",
                    "artifacts.taskrun.storage": "oci",
                    "options": {
                      "deployments": {
                        "tekton-chains-controller": {
                          "spec": {
                            "template": {
                              "spec": {
                                "volumes": [{
                                  "name": "oidc-info",
                                  "projected": {
                                    "sources": [{
                                      "serviceAccountToken": {
                                        "audience": "trusted-artifact-signer",
                                        "expirationSeconds": 600,
                                        "path": "oidc-token"
                                      }
                                    }]
                                  }
                                }]
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }'
              echo "Chains keyless signing configured (TektonConfig CR)"

              # Keep overrides on the owning CR. Direct InstallerSet edits are
              # reverted by the operator and silently restore audience=sigstore.
              # Wait for the actual generated resources, not just a successful
              # patch response, before declaring Chains configured.
              CHAINS_READY=false
              for attempt in {1..60}; do
                ENABLED=$(oc get cm chains-config -n openshift-pipelines \
                  -o jsonpath='{.data.signers\.x509\.fulcio\.enabled}')
                AUDIENCE=$(oc get deployment tekton-chains-controller -n openshift-pipelines \
                  -o jsonpath='{.spec.template.spec.volumes[?(@.name=="oidc-info")].projected.sources[0].serviceAccountToken.audience}')
                if [ "${ENABLED}" = "true" ] && [ "${AUDIENCE}" = "trusted-artifact-signer" ]; then
                  CHAINS_READY=true
                  break
                fi
                echo "Waiting for Chains keyless config and TAS token audience (${attempt}/60)..."
                sleep 5
              done
              if [ "${CHAINS_READY}" != "true" ]; then
                echo "ERROR: Chains keyless configuration did not reconcile"
                exit 1
              fi

              echo "TektonConfig patched"

              # Enable pipelines console plugin
              PLUGIN_NAME="pipelines-console-plugin"
              CURRENT=$(oc get console.operator.openshift.io cluster -o jsonpath='{.spec.plugins}' 2>/dev/null || echo "[]")
              if echo "${CURRENT}" | grep -q "${PLUGIN_NAME}"; then
                echo "Console plugin '${PLUGIN_NAME}' already enabled."
              else
                echo "Enabling console plugin '${PLUGIN_NAME}'..."
                oc patch console.operator.openshift.io cluster --type=json \
                  -p="[{\"op\":\"add\",\"path\":\"/spec/plugins/-\",\"value\":\"${PLUGIN_NAME}\"}]"
                echo "Console plugin enabled."
              fi
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      securityContext:
        seccompProfile:
          type: RuntimeDefault

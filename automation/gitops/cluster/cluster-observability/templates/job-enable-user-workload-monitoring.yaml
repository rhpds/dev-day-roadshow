---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: enable-user-workload-monitoring
  namespace: openshift-monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "0"
---
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: enable-user-workload-monitoring
  namespace: openshift-monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "0"
rules:
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - get
      - create
      - patch
---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: enable-user-workload-monitoring
  namespace: openshift-monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "0"
subjects:
  - kind: ServiceAccount
    name: enable-user-workload-monitoring
    namespace: openshift-monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: enable-user-workload-monitoring
---
apiVersion: batch/v1
kind: Job
metadata:
  name: enable-user-workload-monitoring
  namespace: openshift-monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: enable-user-workload-monitoring
      containers:
        - name: enable-user-workload-monitoring
          image: registry.redhat.io/openshift4/ose-cli-rhel9:latest
          command:
            - /bin/bash
            - -c
            - |
              set -e
              oc apply -f - <<'EOF'
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: cluster-monitoring-config
                namespace: openshift-monitoring
              data:
                config.yaml: |
                  enableUserWorkload: true
                  alertmanagerMain:
                    enableUserAlertmanagerConfig: true
              EOF
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      securityContext:
        seccompProfile:
          type: RuntimeDefault

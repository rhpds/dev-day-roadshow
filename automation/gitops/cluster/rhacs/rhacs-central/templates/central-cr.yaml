apiVersion: platform.stackrox.io/v1alpha1
kind: Central
metadata:
  name: {{ .Values.central.name }}
  namespace: {{ include "rhacs-central.namespace" . }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.syncwave.central | quote }}
spec:
  central:
    exposure:
      route:
        enabled: true
    defaultTLSSecret:
      name: central-default-tls-cert
    declarativeConfiguration:
      configMaps:
        - name: rhacs-tenant-config
      secrets:
        - name: rhacs-declarative-auth
  scannerV4:
    matcher:
      resources:
        limits:
          memory: {{ .Values.scannerV4.matcher.resources.limits.memory }}
        requests:
          memory: {{ .Values.scannerV4.matcher.resources.requests.memory }}

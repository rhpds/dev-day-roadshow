---
# Simulates the current Module 1 exercise on a disposable tenant. The full E2E
# orchestrator is explicitly mutating; the source and promoted release remain.
- name: "E2E — Module 1: The Developer Experience"
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Run the developer workflow with isolated credentials
      block:
        - name: Authenticate the QA runner
          ansible.builtin.import_tasks: tasks/auth.yml

        - name: Require the student credentials and ingress domain
          ansible.builtin.assert:
            that:
              - _tenant_password | length > 0
              - _ingress_domain | length > 0

        - name: Execute the student workflow and assert its outcomes
          ansible.builtin.import_tasks: tasks/module1-workflow.yml
          environment: "{{ _qa_environment }}"
          module_defaults:
            kubernetes.core.k8s_info:
              host: "{{ _k8s_host }}"
              api_key: "{{ _k8s_api_key }}"
              validate_certs: "{{ _k8s_validate_certs }}"
            kubernetes.core.k8s:
              host: "{{ _k8s_host }}"
              api_key: "{{ _k8s_api_key }}"
              validate_certs: "{{ _k8s_validate_certs }}"
            ansible.builtin.uri:
              validate_certs: "{{ _k8s_validate_certs }}"
              timeout: 120
      always:
        - name: Remove only the run-owned sandbox application
          ansible.builtin.command:
            argv: [oc, delete, application, "{{ _m1_id }}", -n, openshift-gitops, --ignore-not-found, --wait=false, --request-timeout=30s]
          environment: "{{ _qa_environment }}"
          when:
            - _m1_id is defined
            - _qa_environment is defined
          register: _m1_cleanup
          failed_when: false
          changed_when: "'deleted' in _m1_cleanup.stdout"

        - name: Warn if sandbox cleanup needs attention
          ansible.builtin.debug:
            msg: "Could not remove run-owned sandbox Application {{ _m1_id }}."
          when: _m1_cleanup.rc | default(0) != 0

        - name: Remove the isolated local kubeconfig
          ansible.builtin.file:
            path: "{{ _qa_kubeconfig.path }}"
            state: absent
          when: _qa_kubeconfig.path is defined

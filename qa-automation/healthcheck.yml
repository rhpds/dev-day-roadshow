---
# =============================================================================
# Dev Day Roadshow — Tenant Healthcheck
# =============================================================================
#
# Purpose:
#   Validates that a tenant environment is fully provisioned and ready
#   for a student to use. Runs at tenant order time via Showroom API.
#
# Usage (CLI):
#   ansible-playbook qa-automation/healthcheck.yml \
#     -e "ocp_api_url=https://api.cluster-xxx.dyn.redhatworkshops.io:6443" \
#     -e "ocp_admin_password=xxx" \
#     -e "tenant_user=user-abc12"
#
# Usage (Showroom runner):
#   Runs automatically — picks up openshift_api_url and user from
#   user_data.yml, authenticates via the runtime-automation SA token.
#
# What it checks (in order):
#   1. Tenant namespaces exist
#   2. ArgoCD apps are Synced + Healthy
#   3. Key deployments are ready (1+ available replicas)
#   4. Routes return HTTP 200 (showroom, parasol-insurance, payments-api)
#
# Design notes:
#   - Tenant-only — no cluster-level checks (cluster is validated before tenants)
#   - Fast — uses k8s_info lookups, no heavy waits
#   - Simple — pass/fail per check, clear error messages
# =============================================================================

- name: Dev Day Roadshow — Tenant Healthcheck
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    # --- Inputs (from CLI -e or showroom user_data.yml) ---
    # CLI names:     ocp_api_url, ocp_admin_password, tenant_user
    # user_data:     openshift_api_url, user (+ SA token for auth)

    # --- Normalize variable names across both entry points ---
    _api_url: "{{ ocp_api_url | default(openshift_api_url) }}"
    _tenant_user: "{{ tenant_user | default(user) }}"
    _use_sa_token: "{{ ocp_admin_password is not defined }}"

    # Namespaces we expect per tenant
    tenant_namespaces:
      - "{{ _tenant_user }}-build"
      - "{{ _tenant_user }}-dev"
      - "{{ _tenant_user }}-prod"
      - "{{ _tenant_user }}-parasol-payments"
      - "{{ _tenant_user }}-parasol-web"
      - "{{ _tenant_user }}-showroom"
      - "{{ _tenant_user }}-devspaces"

    # ArgoCD apps we expect per tenant
    tenant_argo_apps:
      - "bootstrap-tenant-{{ _tenant_user }}"
      - "{{ _tenant_user }}-build"
      - "{{ _tenant_user }}-dev"
      - "{{ _tenant_user }}-prod"
      - "{{ _tenant_user }}-parasol-insurance"
      - "{{ _tenant_user }}-parasol-troubleshooting"
      - "{{ _tenant_user }}-workload-m3"

    # Deployments to check: namespace -> list of deployment names
    tenant_deployments:
      - namespace: "{{ _tenant_user }}-dev"
        deployments:
          - parasol-insurance
          - parasol-db
      - namespace: "{{ _tenant_user }}-prod"
        deployments:
          - parasol-insurance
          - parasol-db
      - namespace: "{{ _tenant_user }}-parasol-payments"
        deployments:
          - payments-api
          - postgres
          - reporting-service
      - namespace: "{{ _tenant_user }}-parasol-web"
        deployments:
          - backend
          - frontend
      - namespace: "{{ _tenant_user }}-showroom"
        deployments:
          - showroom

    # Routes to HTTP-check: student-facing only
    tenant_routes:
      - namespace: "{{ _tenant_user }}-showroom"
        name: showroom
      - namespace: "{{ _tenant_user }}-dev"
        name: parasol-insurance
      - namespace: "{{ _tenant_user }}-prod"
        name: parasol-insurance

    # Track results
    healthcheck_failures: []

  tasks:
    # =========================================================================
    # Auth setup
    # =========================================================================

    - name: Validate required variables
      ansible.builtin.assert:
        that:
          - ocp_api_url is defined or openshift_api_url is defined
          - ocp_admin_password is defined or _use_sa_token | bool
          - tenant_user is defined or user is defined
        fail_msg: >-
          Missing required variables.
          CLI: pass ocp_api_url, ocp_admin_password, tenant_user via -e.
          Showroom runner: openshift_api_url and user come from user_data.yml, auth via SA token.

    # In the showroom runner pod, the pod SA is 'showroom' (no cluster-admin).
    # The 'runtime-automation' SA has cluster-admin. Read its token to auth k8s calls.
    - name: Get runtime-automation SA token
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        namespace: "{{ _tenant_user }}-showroom"
        name: runtime-automation-token
      register: _ra_secret
      when: _use_sa_token | bool

    - name: Set k8s auth for runtime-automation SA
      ansible.builtin.set_fact:
        _k8s_host: "{{ _api_url }}"
        _k8s_api_key: "{{ _ra_secret.resources[0].data.token | b64decode }}"
        _k8s_validate_certs: false
      when: _use_sa_token | bool
      no_log: true

    - name: Login to OpenShift with password (CLI mode)
      ansible.builtin.command:
        cmd: >-
          oc login {{ _api_url }}
          --username admin
          --password {{ ocp_admin_password }}
          --insecure-skip-tls-verify
      changed_when: false
      no_log: true
      when: not (_use_sa_token | bool)

    - name: Set k8s auth for CLI mode
      ansible.builtin.set_fact:
        _k8s_host: ""
        _k8s_api_key: ""
        _k8s_validate_certs: true
      when: not (_use_sa_token | bool)

    # =========================================================================
    # Check 1: Tenant namespaces exist
    # =========================================================================

    - name: "Check namespaces exist for {{ _tenant_user }}"
      kubernetes.core.k8s_info:
        host: "{{ _k8s_host | default(omit, true) }}"
        api_key: "{{ _k8s_api_key | default(omit, true) }}"
        validate_certs: "{{ _k8s_validate_certs }}"
        api_version: v1
        kind: Namespace
        name: "{{ item }}"
      register: r_ns_checks
      loop: "{{ tenant_namespaces }}"

    - name: Record missing namespaces
      ansible.builtin.set_fact:
        healthcheck_failures: >-
          {{ healthcheck_failures + ['Namespace ' + item.item + ' not found'] }}
      loop: "{{ r_ns_checks.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: item.resources | length == 0

    # =========================================================================
    # Check 2: ArgoCD apps are Synced + Healthy
    # =========================================================================

    - name: "Check ArgoCD apps for {{ _tenant_user }}"
      kubernetes.core.k8s_info:
        host: "{{ _k8s_host | default(omit, true) }}"
        api_key: "{{ _k8s_api_key | default(omit, true) }}"
        validate_certs: "{{ _k8s_validate_certs }}"
        api_version: argoproj.io/v1alpha1
        kind: Application
        namespace: openshift-gitops
        name: "{{ item }}"
      register: r_argo_checks
      loop: "{{ tenant_argo_apps }}"

    - name: Identify Progressing ArgoCD apps
      ansible.builtin.set_fact:
        _progressing_apps: >-
          {{ r_argo_checks.results
             | selectattr('resources', 'defined')
             | selectattr('resources')
             | selectattr('resources.0.status.health.status', 'equalto', 'Progressing')
             | map(attribute='item')
             | list }}

    - name: Wait for Progressing ArgoCD apps to reconcile
      when: _progressing_apps | length > 0
      block:
        - name: "Wait 30s for ArgoCD apps to finish reconciling"
          ansible.builtin.pause:
            seconds: 30

        - name: "Recheck ArgoCD apps for {{ _tenant_user }}"
          kubernetes.core.k8s_info:
            host: "{{ _k8s_host | default(omit, true) }}"
            api_key: "{{ _k8s_api_key | default(omit, true) }}"
            validate_certs: "{{ _k8s_validate_certs }}"
            api_version: argoproj.io/v1alpha1
            kind: Application
            namespace: openshift-gitops
            name: "{{ item }}"
          register: r_argo_recheck
          loop: "{{ tenant_argo_apps }}"

        - name: Update results with recheck data
          ansible.builtin.set_fact:
            r_argo_checks: "{{ r_argo_recheck }}"

    - name: Record unhealthy ArgoCD apps
      ansible.builtin.set_fact:
        healthcheck_failures: >-
          {{ healthcheck_failures +
             ['ArgoCD app ' + item.item + ' is ' +
              (item.resources[0].status.sync.status | default('Unknown')) + '/' +
              (item.resources[0].status.health.status | default('Unknown'))] }}
      loop: "{{ r_argo_checks.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: >-
        item.resources | length == 0
        or item.resources[0].status.sync.status | default('') != 'Synced'
        or item.resources[0].status.health.status | default('') != 'Healthy'

    # =========================================================================
    # Check 3: Key deployments have available replicas
    # =========================================================================

    - name: "Check deployments for {{ _tenant_user }}"
      kubernetes.core.k8s_info:
        host: "{{ _k8s_host | default(omit, true) }}"
        api_key: "{{ _k8s_api_key | default(omit, true) }}"
        validate_certs: "{{ _k8s_validate_certs }}"
        api_version: apps/v1
        kind: Deployment
        namespace: "{{ item.0.namespace }}"
        name: "{{ item.1 }}"
      register: r_deploy_checks
      loop: "{{ tenant_deployments | subelements('deployments') }}"
      loop_control:
        label: "{{ item.0.namespace }}/{{ item.1 }}"

    - name: Record unavailable deployments
      ansible.builtin.set_fact:
        healthcheck_failures: >-
          {{ healthcheck_failures +
             ['Deployment ' + item.item.0.namespace + '/' + item.item.1 +
              ' has 0 available replicas'] }}
      loop: "{{ r_deploy_checks.results }}"
      loop_control:
        label: "{{ item.item.0.namespace }}/{{ item.item.1 }}"
      when: >-
        item.resources | length == 0
        or (item.resources[0].status.availableReplicas | default(0)) < 1

    # =========================================================================
    # Check 4: Student-facing routes return HTTP 200
    # =========================================================================

    - name: "Get route URLs for {{ _tenant_user }}"
      kubernetes.core.k8s_info:
        host: "{{ _k8s_host | default(omit, true) }}"
        api_key: "{{ _k8s_api_key | default(omit, true) }}"
        validate_certs: "{{ _k8s_validate_certs }}"
        api_version: route.openshift.io/v1
        kind: Route
        namespace: "{{ item.namespace }}"
        name: "{{ item.name }}"
      register: r_route_lookups
      loop: "{{ tenant_routes }}"
      loop_control:
        label: "{{ item.namespace }}/{{ item.name }}"

    - name: Check route responds with HTTP 200
      ansible.builtin.uri:
        url: "https://{{ item.resources[0].spec.host }}"
        method: GET
        validate_certs: false
        status_code: [200]
        timeout: 10
      register: r_http_checks
      loop: "{{ r_route_lookups.results }}"
      loop_control:
        label: "{{ item.item.namespace }}/{{ item.item.name }}"
      when: item.resources | length > 0
      ignore_errors: true

    - name: Record failed HTTP checks
      ansible.builtin.set_fact:
        healthcheck_failures: >-
          {{ healthcheck_failures +
             ['Route ' + item.item.item.namespace + '/' + item.item.item.name +
              ' did not return HTTP 200 (got ' + (item.status | default('no response') | string) + ')'] }}
      loop: "{{ r_http_checks.results }}"
      loop_control:
        label: "{{ item.item.item.namespace | default('unknown') }}/{{ item.item.item.name | default('unknown') }}"
      when:
        - item is not skipped
        - item is failed

    # =========================================================================
    # Summary
    # =========================================================================

    - name: "Healthcheck PASSED for {{ _tenant_user }}"
      ansible.builtin.debug:
        msg: "All checks passed for tenant {{ _tenant_user }}"
      when: healthcheck_failures | length == 0

    - name: "Healthcheck FAILED for {{ _tenant_user }}"
      ansible.builtin.fail:
        msg: |
          Healthcheck failed with {{ healthcheck_failures | length }} issue(s):
          {% for f in healthcheck_failures %}
            - {{ f }}
          {% endfor %}
      when: healthcheck_failures | length > 0

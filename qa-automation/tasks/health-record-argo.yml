---
- name: Record unhealthy ArgoCD apps
  ansible.builtin.set_fact:
    healthcheck_failures: >-
      {{ healthcheck_failures +
         ['ArgoCD app ' + item.item + ' is ' +
          (item.resources[0].status.sync.status | default('Unknown')) + '/' +
          (item.resources[0].status.health.status | default('Unknown'))] }}
  loop: "{{ r_argo_checks.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: >-
    item.resources | length == 0
    or (item.resources[0].status.health.status | default('') not in ['Healthy', 'Progressing']
    and not (item.item == _tenant_user ~ '-secured-prod' and _m2_prod_release_pending | default(false) | bool))

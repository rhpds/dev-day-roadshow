---
# =============================================================================
# E2E — Module 4: AI-Powered Troubleshooting (Student Workflow Simulation)
# =============================================================================
# Simulates actual student actions from Module 4:
#   E1: Investigate frontend timeout → patch NetworkPolicy → verify fix
#   E2: Diagnose payment alert → rollback reporting-service → verify recovery
#   E3: Query Prometheus metrics + check monitoring resources
# =============================================================================

- name: "E2E — Module 4: AI-Powered Troubleshooting"
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    _api_url: "{{ ocp_api_url | default(openshift_api_url) }}"
    _tenant_user: "{{ tenant_user | default(user) }}"
    _use_sa_token: "{{ ocp_admin_password is not defined }}"
    _load_iterations: "{{ load_iterations | default(5) }}"
    e2e_failures: []

  tasks:
    - name: Validate required variables
      ansible.builtin.assert:
        that:
          - ocp_api_url is defined or openshift_api_url is defined
          - ocp_admin_password is defined or _use_sa_token | bool
          - tenant_user is defined or user is defined
        fail_msg: "Pass ocp_api_url, ocp_admin_password, and tenant_user via -e (or run in showroom runner)"

    - name: Get runtime-automation SA token
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        namespace: "{{ _tenant_user }}-showroom"
        name: runtime-automation-token
      register: _ra_secret
      when: _use_sa_token | bool

    - name: Set k8s auth for runtime-automation SA
      ansible.builtin.set_fact:
        _k8s_host: "{{ _api_url }}"
        _k8s_api_key: "{{ _ra_secret.resources[0].data.token | b64decode }}"
        _k8s_validate_certs: false
      when: _use_sa_token | bool
      no_log: true

    - name: Login to OpenShift with password
      ansible.builtin.command:
        cmd: >-
          oc login {{ _api_url }}
          --username admin
          --password {{ ocp_admin_password }}
          --insecure-skip-tls-verify
      changed_when: false
      no_log: true
      when: not (_use_sa_token | bool)

    - name: Set k8s auth for CLI mode
      ansible.builtin.set_fact:
        _k8s_host: ""
        _k8s_api_key: ""
        _k8s_validate_certs: true
      when: not (_use_sa_token | bool)

    # -----------------------------------------------------------------
    # Pre-condition checks
    # -----------------------------------------------------------------
    - name: "M4-E1: Check parasol-web deployments exist"
      kubernetes.core.k8s_info:
        host: "{{ _k8s_host | default(omit, true) }}"
        api_key: "{{ _k8s_api_key | default(omit, true) }}"
        validate_certs: "{{ _k8s_validate_certs }}"
        api_version: apps/v1
        kind: Deployment
        namespace: "{{ _tenant_user }}-parasol-web"
      register: r_parasol_web

    - name: Record parasol-web deployments missing
      ansible.builtin.set_fact:
        e2e_failures: >-
          {{ e2e_failures + ['M4-E1: No deployments found in ' + _tenant_user + '-parasol-web'] }}
      when: r_parasol_web.resources | length == 0

    - name: "M4-E1: Verify NetworkPolicy exists (the intentionally broken one)"
      kubernetes.core.k8s_info:
        host: "{{ _k8s_host | default(omit, true) }}"
        api_key: "{{ _k8s_api_key | default(omit, true) }}"
        validate_certs: "{{ _k8s_validate_certs }}"
        api_version: networking.k8s.io/v1
        kind: NetworkPolicy
        namespace: "{{ _tenant_user }}-parasol-web"
      register: r_netpol

    - name: Record no NetworkPolicy found
      ansible.builtin.set_fact:
        e2e_failures: >-
          {{ e2e_failures + ['M4-E1: No NetworkPolicy in ' + _tenant_user + '-parasol-web'] }}
      when: r_netpol.resources | length == 0

    - name: "M4-E2: Check reporting-service deployment"
      kubernetes.core.k8s_info:
        host: "{{ _k8s_host | default(omit, true) }}"
        api_key: "{{ _k8s_api_key | default(omit, true) }}"
        validate_certs: "{{ _k8s_validate_certs }}"
        api_version: apps/v1
        kind: Deployment
        namespace: "{{ _tenant_user }}-parasol-payments"
        name: reporting-service
      register: r_reporting_svc

    - name: Record reporting-service missing
      ansible.builtin.set_fact:
        e2e_failures: >-
          {{ e2e_failures + ['M4-E2: reporting-service deployment not found in ' + _tenant_user + '-parasol-payments'] }}
      when: r_reporting_svc.resources | length == 0

    - name: "M4-E2: Check PrometheusRule for PaymentErrorRateHigh alert"
      kubernetes.core.k8s_info:
        host: "{{ _k8s_host | default(omit, true) }}"
        api_key: "{{ _k8s_api_key | default(omit, true) }}"
        validate_certs: "{{ _k8s_validate_certs }}"
        api_version: monitoring.coreos.com/v1
        kind: PrometheusRule
        namespace: "{{ _tenant_user }}-parasol-payments"
      register: r_prom_rules
      ignore_errors: true

    - name: Record no PrometheusRule found
      ansible.builtin.set_fact:
        e2e_failures: >-
          {{ e2e_failures + ['M4-E2: No PrometheusRule in ' + _tenant_user + '-parasol-payments'] }}
      when: r_prom_rules.resources | default([]) | length == 0

    - name: "M4-E3: Check Perses CRD installed"
      kubernetes.core.k8s_info:
        host: "{{ _k8s_host | default(omit, true) }}"
        api_key: "{{ _k8s_api_key | default(omit, true) }}"
        validate_certs: "{{ _k8s_validate_certs }}"
        api_version: apiextensions.k8s.io/v1
        kind: CustomResourceDefinition
        name: persesdashboards.perses.dev
      register: r_perses_crd
      ignore_errors: true

    - name: Record Perses CRD missing
      ansible.builtin.set_fact:
        e2e_failures: >-
          {{ e2e_failures + ['M4-E3: Perses CRD not found'] }}
      when: r_perses_crd.resources | default([]) | length == 0

    - name: "M4: Check Lightspeed deployment in openshift-lightspeed"
      kubernetes.core.k8s_info:
        host: "{{ _k8s_host | default(omit, true) }}"
        api_key: "{{ _k8s_api_key | default(omit, true) }}"
        validate_certs: "{{ _k8s_validate_certs }}"
        api_version: apps/v1
        kind: Deployment
        namespace: openshift-lightspeed
      register: r_lightspeed
      ignore_errors: true

    - name: Record Lightspeed not deployed
      ansible.builtin.set_fact:
        e2e_failures: >-
          {{ e2e_failures + ['M4: No deployments in openshift-lightspeed'] }}
      when: r_lightspeed.resources | default([]) | length == 0

    - name: Bail out if pre-conditions failed
      ansible.builtin.fail:
        msg: |
          Pre-condition checks failed — cannot run load tests:
          {% for f in e2e_failures %}
            - {{ f }}
          {% endfor %}
      when: e2e_failures | length > 0

    # =================================================================
    # EXERCISE 1: Investigate + fix frontend timeout (parasol-web)
    # =================================================================

    # Step 1: Student sees timeout — frontend pod can't reach backend (NetworkPolicy blocks it)
    - name: "E1-BEFORE: Get a frontend pod name"
      kubernetes.core.k8s_info:
        host: "{{ _k8s_host | default(omit, true) }}"
        api_key: "{{ _k8s_api_key | default(omit, true) }}"
        validate_certs: "{{ _k8s_validate_certs }}"
        api_version: v1
        kind: Pod
        namespace: "{{ _tenant_user }}-parasol-web"
        label_selectors:
          - app=frontend
        field_selectors:
          - status.phase=Running
      register: r_frontend_pods

    - name: "E1-BEFORE: Test frontend→backend connectivity (expect timeout)"
      kubernetes.core.k8s_exec:
        host: "{{ _k8s_host | default(omit, true) }}"
        api_key: "{{ _k8s_api_key | default(omit, true) }}"
        validate_certs: "{{ _k8s_validate_certs }}"
        namespace: "{{ _tenant_user }}-parasol-web"
        pod: "{{ r_frontend_pods.resources[0].metadata.name }}"
        command: "sh -c 'wget -qO- --timeout=5 http://backend-service:8080/health 2>&1 || true'"
      register: r_web_before
      ignore_errors: true
      when: r_frontend_pods.resources | length > 0

    # Step 2: Student investigates — check backend pods
    - name: "E1-INVESTIGATE: List backend pods (student checks pod status)"
      kubernetes.core.k8s_info:
        host: "{{ _k8s_host | default(omit, true) }}"
        api_key: "{{ _k8s_api_key | default(omit, true) }}"
        validate_certs: "{{ _k8s_validate_certs }}"
        api_version: v1
        kind: Pod
        namespace: "{{ _tenant_user }}-parasol-web"
        label_selectors:
          - app=backend
      register: r_backend_pods

    # Step 3: Student gets NetworkPolicy details (Lightspeed reads this)
    - name: "E1-INVESTIGATE: Read current NetworkPolicy spec"
      kubernetes.core.k8s_info:
        host: "{{ _k8s_host | default(omit, true) }}"
        api_key: "{{ _k8s_api_key | default(omit, true) }}"
        validate_certs: "{{ _k8s_validate_certs }}"
        api_version: networking.k8s.io/v1
        kind: NetworkPolicy
        namespace: "{{ _tenant_user }}-parasol-web"
      register: r_netpol_detail

    # Step 4: Lightspeed patches NetworkPolicy — allow frontend→backend
    - name: "E1-FIX: Patch NetworkPolicy to allow frontend→backend traffic"
      kubernetes.core.k8s:
        host: "{{ _k8s_host | default(omit, true) }}"
        api_key: "{{ _k8s_api_key | default(omit, true) }}"
        validate_certs: "{{ _k8s_validate_certs }}"
        state: patched
        api_version: networking.k8s.io/v1
        kind: NetworkPolicy
        namespace: "{{ _tenant_user }}-parasol-web"
        name: "{{ r_netpol_detail.resources[0].metadata.name }}"
        definition:
          spec:
            ingress:
              - from:
                  - podSelector:
                      matchLabels:
                        tier: frontend
                ports: "{{ r_netpol_detail.resources[0].spec.ingress[0].ports | default([]) }}"
      when: r_netpol_detail.resources | length > 0
      ignore_errors: true
      register: r_netpol_patch

    # Step 5: Student verifies fix — frontend can now reach backend
    - name: "E1-AFTER: Test frontend→backend connectivity (expect success)"
      kubernetes.core.k8s_exec:
        host: "{{ _k8s_host | default(omit, true) }}"
        api_key: "{{ _k8s_api_key | default(omit, true) }}"
        validate_certs: "{{ _k8s_validate_certs }}"
        namespace: "{{ _tenant_user }}-parasol-web"
        pod: "{{ r_frontend_pods.resources[0].metadata.name }}"
        command: "sh -c 'wget -qO- --timeout=5 http://backend-service:8080/health 2>&1 || true'"
      register: r_web_after
      ignore_errors: true
      when: r_frontend_pods.resources | length > 0

    # =================================================================
    # EXERCISE 2: Diagnose + fix critical alert (parasol-payments)
    # =================================================================

    - name: "M4-E2: Get payments-api route"
      kubernetes.core.k8s_info:
        host: "{{ _k8s_host | default(omit, true) }}"
        api_key: "{{ _k8s_api_key | default(omit, true) }}"
        validate_certs: "{{ _k8s_validate_certs }}"
        api_version: route.openshift.io/v1
        kind: Route
        namespace: "{{ _tenant_user }}-parasol-payments"
      register: r_payments_routes

    - name: Set payments-api URL
      ansible.builtin.set_fact:
        _payments_url: "https://{{ r_payments_routes.resources[0].spec.host }}"
      when: r_payments_routes.resources | default([]) | length > 0

    # Step 1: Student hits payments-api — sees 500s from buggy reporting-service
    - name: "E2-BEFORE: HTTP GET payments-api (student sees errors from buggy reporting-service)"
      ansible.builtin.uri:
        url: "{{ _payments_url }}"
        method: GET
        validate_certs: false
        status_code: [200, 500, 502, 503, 504]
        timeout: 15
      loop: "{{ range(0, _load_iterations | int) | list }}"
      loop_control:
        label: "pre-rollback-{{ item }}"
      register: r_payments_before
      ignore_errors: true
      when: _payments_url is defined

    # Step 2: Student checks PrometheusRules — finds PaymentErrorRateHigh firing
    - name: "E2-INVESTIGATE: Query PrometheusRules in parasol-payments"
      kubernetes.core.k8s_info:
        host: "{{ _k8s_host | default(omit, true) }}"
        api_key: "{{ _k8s_api_key | default(omit, true) }}"
        validate_certs: "{{ _k8s_validate_certs }}"
        api_version: monitoring.coreos.com/v1
        kind: PrometheusRule
        namespace: "{{ _tenant_user }}-parasol-payments"
      register: r_prom_rules_detail
      ignore_errors: true

    # Step 3: Student checks deployment history — finds recent bad rollout
    - name: "E2-INVESTIGATE: Check ReplicaSets for reporting-service (recent rollout history)"
      kubernetes.core.k8s_info:
        host: "{{ _k8s_host | default(omit, true) }}"
        api_key: "{{ _k8s_api_key | default(omit, true) }}"
        validate_certs: "{{ _k8s_validate_certs }}"
        api_version: apps/v1
        kind: ReplicaSet
        namespace: "{{ _tenant_user }}-parasol-payments"
        label_selectors:
          - app=reporting-service
      register: r_reporting_rs
      ignore_errors: true

    # Step 4: Lightspeed rolls back reporting-service (SA token mode)
    - name: "E2-FIX: Rollback reporting-service deployment"
      ansible.builtin.command:
        cmd: >-
          oc rollout undo deployment/reporting-service
          -n {{ _tenant_user }}-parasol-payments
          --server={{ _api_url }}
          --token={{ _k8s_api_key }}
          --insecure-skip-tls-verify
      when: _use_sa_token | bool
      ignore_errors: true
      register: r_rollback_sa
      no_log: true

    - name: "E2-FIX: Rollback reporting-service deployment (CLI mode)"
      ansible.builtin.command:
        cmd: >-
          oc rollout undo deployment/reporting-service
          -n {{ _tenant_user }}-parasol-payments
      when: not (_use_sa_token | bool)
      ignore_errors: true
      register: r_rollback_cli

    # Step 5: Wait for rollback to stabilize
    - name: "E2-FIX: Wait for reporting-service rollout to complete"
      ansible.builtin.command:
        cmd: >-
          oc rollout status deployment/reporting-service
          -n {{ _tenant_user }}-parasol-payments
          --timeout=60s
          {% if _use_sa_token | bool %}
          --server={{ _api_url }}
          --token={{ _k8s_api_key }}
          --insecure-skip-tls-verify
          {% endif %}
      ignore_errors: true
      register: r_rollout_status
      no_log: true

    # Step 6: Student verifies payments-api recovered
    - name: "E2-AFTER: HTTP GET payments-api (student verifies recovery after rollback)"
      ansible.builtin.uri:
        url: "{{ _payments_url }}"
        method: GET
        validate_certs: false
        status_code: [200, 500, 502, 503, 504]
        timeout: 15
      loop: "{{ range(0, _load_iterations | int) | list }}"
      loop_control:
        label: "post-rollback-{{ item }}"
      register: r_payments_after
      ignore_errors: true
      when: _payments_url is defined

    # =================================================================
    # EXERCISE 3: Monitoring — query metrics + check resources
    # =================================================================

    # Step 1: Student queries Prometheus metrics (simulates PromQL in dashboard)
    - name: "E3: Get Thanos querier route"
      kubernetes.core.k8s_info:
        host: "{{ _k8s_host | default(omit, true) }}"
        api_key: "{{ _k8s_api_key | default(omit, true) }}"
        validate_certs: "{{ _k8s_validate_certs }}"
        api_version: route.openshift.io/v1
        kind: Route
        namespace: openshift-monitoring
        name: thanos-querier
      register: r_thanos_route
      ignore_errors: true

    - name: Set Thanos URL
      ansible.builtin.set_fact:
        _thanos_url: "https://{{ r_thanos_route.resources[0].spec.host }}"
      when: r_thanos_route.resources | default([]) | length > 0

    - name: "E3: PromQL — request rate by status code"
      ansible.builtin.uri:
        url: "{{ _thanos_url }}/api/v1/query?query={{ 'rate(http_server_requests_seconds_count{namespace=\"' + _tenant_user + '-parasol-payments\"}[5m])' | urlencode }}"
        method: GET
        validate_certs: false
        headers:
          Authorization: "Bearer {{ _k8s_api_key }}"
        status_code: [200, 401, 403, 422, 503]
        timeout: 15
      register: r_prom_request_rate
      ignore_errors: true
      when:
        - _thanos_url is defined
        - _k8s_api_key | default('') | length > 0

    - name: "E3: PromQL — error rate ratio"
      ansible.builtin.uri:
        url: "{{ _thanos_url }}/api/v1/query?query={{ 'sum(rate(http_server_requests_seconds_count{namespace=\"' + _tenant_user + '-parasol-payments\",status=~\"5..\"}[5m]))/sum(rate(http_server_requests_seconds_count{namespace=\"' + _tenant_user + '-parasol-payments\"}[5m]))' | urlencode }}"
        method: GET
        validate_certs: false
        headers:
          Authorization: "Bearer {{ _k8s_api_key }}"
        status_code: [200, 401, 403, 422, 503]
        timeout: 15
      register: r_prom_error_ratio
      ignore_errors: true
      when:
        - _thanos_url is defined
        - _k8s_api_key | default('') | length > 0

    - name: "E3: PromQL — CPU usage by pod"
      ansible.builtin.uri:
        url: "{{ _thanos_url }}/api/v1/query?query={{ 'sum(rate(container_cpu_usage_seconds_total{namespace=\"' + _tenant_user + '-parasol-payments\"}[5m])) by (pod)' | urlencode }}"
        method: GET
        validate_certs: false
        headers:
          Authorization: "Bearer {{ _k8s_api_key }}"
        status_code: [200, 401, 403, 422, 503]
        timeout: 15
      register: r_prom_cpu
      ignore_errors: true
      when:
        - _thanos_url is defined
        - _k8s_api_key | default('') | length > 0

    # Step 2: Student checks ServiceMonitors
    - name: "E3: Query ServiceMonitors in parasol-payments"
      kubernetes.core.k8s_info:
        host: "{{ _k8s_host | default(omit, true) }}"
        api_key: "{{ _k8s_api_key | default(omit, true) }}"
        validate_certs: "{{ _k8s_validate_certs }}"
        api_version: monitoring.coreos.com/v1
        kind: ServiceMonitor
        namespace: "{{ _tenant_user }}-parasol-payments"
      register: r_service_monitors
      ignore_errors: true

    # Step 3: Student checks pod health post-fix
    - name: "E3: List pods in parasol-web (post-fix health check)"
      kubernetes.core.k8s_info:
        host: "{{ _k8s_host | default(omit, true) }}"
        api_key: "{{ _k8s_api_key | default(omit, true) }}"
        validate_certs: "{{ _k8s_validate_certs }}"
        api_version: v1
        kind: Pod
        namespace: "{{ _tenant_user }}-parasol-web"
      register: r_web_pods

    - name: "E3: List pods in parasol-payments (post-rollback health check)"
      kubernetes.core.k8s_info:
        host: "{{ _k8s_host | default(omit, true) }}"
        api_key: "{{ _k8s_api_key | default(omit, true) }}"
        validate_certs: "{{ _k8s_validate_certs }}"
        api_version: v1
        kind: Pod
        namespace: "{{ _tenant_user }}-parasol-payments"
      register: r_payments_pods

    # =================================================================
    # Summary
    # =================================================================
    - name: "E2E Module 4 — Student Workflow Summary"
      ansible.builtin.debug:
        msg: >-
          Module 4 workflow complete for {{ _tenant_user }}:
          E1 frontend→backend BEFORE fix: {{ r_web_before.rc | default('skipped') }} |
          E1 NetworkPolicy patch: {{ 'applied' if (r_netpol_patch is defined and r_netpol_patch is not failed) else 'skipped/failed' }} |
          E1 frontend→backend AFTER fix: {{ r_web_after.rc | default('skipped') }} |
          E2 payments-api BEFORE rollback: {{ r_payments_before.results | default([]) | length }}/{{ _load_iterations }} requests |
          E2 reporting-service rollback: {{ 'done' if ((r_rollback_sa is defined and r_rollback_sa is not failed) or (r_rollback_cli is defined and r_rollback_cli is not failed)) else 'skipped/failed' }} |
          E2 payments-api AFTER rollback: {{ r_payments_after.results | default([]) | length }}/{{ _load_iterations }} requests |
          E3 PromQL queries: {{ 'executed' if r_prom_request_rate is defined else 'skipped' }} |
          Web pods: {{ r_web_pods.resources | default([]) | length }} |
          Payments pods: {{ r_payments_pods.resources | default([]) | length }}

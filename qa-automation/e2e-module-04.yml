---
# =============================================================================
# E2E — Module 4: AI-Powered Troubleshooting (Load-Generating)
# =============================================================================
# Validates pre-conditions then simulates student activity:
#   - HTTP requests to parasol-web frontend (expects timeouts from broken NetworkPolicy)
#   - HTTP requests to payments-api (expects 500s from buggy reporting-service)
#   - Queries Prometheus ServiceMonitors and pod status
#   - Checks Perses CRD and Lightspeed deployment
# =============================================================================

- name: "E2E — Module 4: AI-Powered Troubleshooting"
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    _api_url: "{{ ocp_api_url | default(openshift_api_url) }}"
    _tenant_user: "{{ tenant_user | default(user) }}"
    _use_sa_token: "{{ ocp_admin_password is not defined }}"
    _load_iterations: "{{ load_iterations | default(5) }}"
    e2e_failures: []

  tasks:
    - name: Validate required variables
      ansible.builtin.assert:
        that:
          - ocp_api_url is defined or openshift_api_url is defined
          - ocp_admin_password is defined or _use_sa_token | bool
          - tenant_user is defined or user is defined
        fail_msg: "Pass ocp_api_url, ocp_admin_password, and tenant_user via -e (or run in showroom runner)"

    - name: Get runtime-automation SA token
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        namespace: "{{ _tenant_user }}-showroom"
        name: runtime-automation-token
      register: _ra_secret
      when: _use_sa_token | bool

    - name: Set k8s auth for runtime-automation SA
      ansible.builtin.set_fact:
        _k8s_host: "{{ _api_url }}"
        _k8s_api_key: "{{ _ra_secret.resources[0].data.token | b64decode }}"
        _k8s_validate_certs: false
      when: _use_sa_token | bool
      no_log: true

    - name: Login to OpenShift with password
      ansible.builtin.command:
        cmd: >-
          oc login {{ _api_url }}
          --username admin
          --password {{ ocp_admin_password }}
          --insecure-skip-tls-verify
      changed_when: false
      no_log: true
      when: not (_use_sa_token | bool)

    - name: Set k8s auth for CLI mode
      ansible.builtin.set_fact:
        _k8s_host: ""
        _k8s_api_key: ""
        _k8s_validate_certs: true
      when: not (_use_sa_token | bool)

    # -----------------------------------------------------------------
    # Exercise 1: Parasol Web — frontend + backend deployed
    # -----------------------------------------------------------------
    - name: "M4-E1: Check parasol-web deployments exist"
      kubernetes.core.k8s_info:
        host: "{{ _k8s_host | default(omit, true) }}"
        api_key: "{{ _k8s_api_key | default(omit, true) }}"
        validate_certs: "{{ _k8s_validate_certs }}"
        api_version: apps/v1
        kind: Deployment
        namespace: "{{ _tenant_user }}-parasol-web"
      register: r_parasol_web

    - name: Record parasol-web deployments missing
      ansible.builtin.set_fact:
        e2e_failures: >-
          {{ e2e_failures + ['M4-E1: No deployments found in ' + _tenant_user + '-parasol-web'] }}
      when: r_parasol_web.resources | length == 0

    - name: "M4-E1: Verify NetworkPolicy exists (the intentionally broken one)"
      kubernetes.core.k8s_info:
        host: "{{ _k8s_host | default(omit, true) }}"
        api_key: "{{ _k8s_api_key | default(omit, true) }}"
        validate_certs: "{{ _k8s_validate_certs }}"
        api_version: networking.k8s.io/v1
        kind: NetworkPolicy
        namespace: "{{ _tenant_user }}-parasol-web"
      register: r_netpol

    - name: Record no NetworkPolicy found
      ansible.builtin.set_fact:
        e2e_failures: >-
          {{ e2e_failures + ['M4-E1: No NetworkPolicy in ' + _tenant_user + '-parasol-web — exercise 1 scenario missing'] }}
      when: r_netpol.resources | length == 0

    # -----------------------------------------------------------------
    # Exercise 2: Parasol Payments — reporting-service deployed
    # -----------------------------------------------------------------
    - name: "M4-E2: Check reporting-service deployment"
      kubernetes.core.k8s_info:
        host: "{{ _k8s_host | default(omit, true) }}"
        api_key: "{{ _k8s_api_key | default(omit, true) }}"
        validate_certs: "{{ _k8s_validate_certs }}"
        api_version: apps/v1
        kind: Deployment
        namespace: "{{ _tenant_user }}-parasol-payments"
        name: reporting-service
      register: r_reporting_svc

    - name: Record reporting-service missing
      ansible.builtin.set_fact:
        e2e_failures: >-
          {{ e2e_failures + ['M4-E2: reporting-service deployment not found in ' + _tenant_user + '-parasol-payments'] }}
      when: r_reporting_svc.resources | length == 0

    - name: "M4-E2: Check PrometheusRule for PaymentErrorRateHigh alert"
      kubernetes.core.k8s_info:
        host: "{{ _k8s_host | default(omit, true) }}"
        api_key: "{{ _k8s_api_key | default(omit, true) }}"
        validate_certs: "{{ _k8s_validate_certs }}"
        api_version: monitoring.coreos.com/v1
        kind: PrometheusRule
        namespace: "{{ _tenant_user }}-parasol-payments"
      register: r_prom_rules
      ignore_errors: true

    - name: Record no PrometheusRule found
      ansible.builtin.set_fact:
        e2e_failures: >-
          {{ e2e_failures + ['M4-E2: No PrometheusRule in ' + _tenant_user + '-parasol-payments — alert scenario may be missing'] }}
      when: r_prom_rules.resources | default([]) | length == 0

    # -----------------------------------------------------------------
    # Exercise 3: Perses operator available
    # -----------------------------------------------------------------
    - name: "M4-E3: Check Perses CRD installed"
      kubernetes.core.k8s_info:
        host: "{{ _k8s_host | default(omit, true) }}"
        api_key: "{{ _k8s_api_key | default(omit, true) }}"
        validate_certs: "{{ _k8s_validate_certs }}"
        api_version: apiextensions.k8s.io/v1
        kind: CustomResourceDefinition
        name: persesdashboards.perses.dev
      register: r_perses_crd
      ignore_errors: true

    - name: Record Perses CRD missing
      ansible.builtin.set_fact:
        e2e_failures: >-
          {{ e2e_failures + ['M4-E3: Perses CRD not found — dashboard exercise will not work'] }}
      when: r_perses_crd.resources | default([]) | length == 0

    # -----------------------------------------------------------------
    # Lightspeed available
    # -----------------------------------------------------------------
    - name: "M4: Check Lightspeed deployment in openshift-lightspeed"
      kubernetes.core.k8s_info:
        host: "{{ _k8s_host | default(omit, true) }}"
        api_key: "{{ _k8s_api_key | default(omit, true) }}"
        validate_certs: "{{ _k8s_validate_certs }}"
        api_version: apps/v1
        kind: Deployment
        namespace: openshift-lightspeed
      register: r_lightspeed
      ignore_errors: true

    - name: Record Lightspeed not deployed
      ansible.builtin.set_fact:
        e2e_failures: >-
          {{ e2e_failures + ['M4: No deployments in openshift-lightspeed — Lightspeed may not be installed'] }}
      when: r_lightspeed.resources | default([]) | length == 0

    - name: Bail out if pre-conditions failed
      ansible.builtin.fail:
        msg: |
          Pre-condition checks failed — cannot run load tests:
          {% for f in e2e_failures %}
            - {{ f }}
          {% endfor %}
      when: e2e_failures | length > 0

    # =================================================================
    # LOAD SIMULATION — Student actions that generate real traffic
    # =================================================================

    # -----------------------------------------------------------------
    # E1: Student checks frontend pod — hits parasol-web route
    # -----------------------------------------------------------------
    - name: "M4-E1: Get parasol-web frontend route"
      kubernetes.core.k8s_info:
        host: "{{ _k8s_host | default(omit, true) }}"
        api_key: "{{ _k8s_api_key | default(omit, true) }}"
        validate_certs: "{{ _k8s_validate_certs }}"
        api_version: route.openshift.io/v1
        kind: Route
        namespace: "{{ _tenant_user }}-parasol-web"
      register: r_parasol_web_routes

    - name: Set parasol-web frontend URL
      ansible.builtin.set_fact:
        _parasol_web_url: "https://{{ r_parasol_web_routes.resources[0].spec.host }}"
      when: r_parasol_web_routes.resources | default([]) | length > 0

    - name: "LOAD: HTTP GET parasol-web frontend (student refreshes to see timeout)"
      ansible.builtin.uri:
        url: "{{ _parasol_web_url }}"
        method: GET
        validate_certs: false
        status_code: [200, 502, 503, 504]
        timeout: 15
      loop: "{{ range(0, _load_iterations | int) | list }}"
      loop_control:
        label: "parasol-web-{{ item }}"
      register: r_web_hits
      ignore_errors: true
      when: _parasol_web_url is defined

    # -----------------------------------------------------------------
    # E2: Student checks payments-api — hits payments route
    # -----------------------------------------------------------------
    - name: "M4-E2: Get payments-api route"
      kubernetes.core.k8s_info:
        host: "{{ _k8s_host | default(omit, true) }}"
        api_key: "{{ _k8s_api_key | default(omit, true) }}"
        validate_certs: "{{ _k8s_validate_certs }}"
        api_version: route.openshift.io/v1
        kind: Route
        namespace: "{{ _tenant_user }}-parasol-payments"
      register: r_payments_routes

    - name: Set payments-api URL
      ansible.builtin.set_fact:
        _payments_url: "https://{{ r_payments_routes.resources[0].spec.host }}"
      when: r_payments_routes.resources | default([]) | length > 0

    - name: "LOAD: HTTP GET payments-api (student checks error rates)"
      ansible.builtin.uri:
        url: "{{ _payments_url }}"
        method: GET
        validate_certs: false
        status_code: [200, 500, 502, 503, 504]
        timeout: 15
      loop: "{{ range(0, _load_iterations | int) | list }}"
      loop_control:
        label: "payments-{{ item }}"
      register: r_payments_hits
      ignore_errors: true
      when: _payments_url is defined

    - name: "LOAD: HTTP GET payments-api /health (student monitors recovery)"
      ansible.builtin.uri:
        url: "{{ _payments_url }}/health"
        method: GET
        validate_certs: false
        status_code: [200, 404, 500, 502, 503]
        timeout: 15
      loop: "{{ range(0, _load_iterations | int) | list }}"
      loop_control:
        label: "payments-health-{{ item }}"
      register: r_payments_health_hits
      ignore_errors: true
      when: _payments_url is defined

    # -----------------------------------------------------------------
    # E3: Student queries Prometheus metrics (simulates dashboard building)
    # -----------------------------------------------------------------
    - name: "LOAD: Query ServiceMonitors in parasol-payments"
      kubernetes.core.k8s_info:
        host: "{{ _k8s_host | default(omit, true) }}"
        api_key: "{{ _k8s_api_key | default(omit, true) }}"
        validate_certs: "{{ _k8s_validate_certs }}"
        api_version: monitoring.coreos.com/v1
        kind: ServiceMonitor
        namespace: "{{ _tenant_user }}-parasol-payments"
      register: r_service_monitors
      ignore_errors: true

    - name: "LOAD: List pods in parasol-web (student checks pod status)"
      kubernetes.core.k8s_info:
        host: "{{ _k8s_host | default(omit, true) }}"
        api_key: "{{ _k8s_api_key | default(omit, true) }}"
        validate_certs: "{{ _k8s_validate_certs }}"
        api_version: v1
        kind: Pod
        namespace: "{{ _tenant_user }}-parasol-web"
      register: r_web_pods

    - name: "LOAD: List pods in parasol-payments (student checks pod status)"
      kubernetes.core.k8s_info:
        host: "{{ _k8s_host | default(omit, true) }}"
        api_key: "{{ _k8s_api_key | default(omit, true) }}"
        validate_certs: "{{ _k8s_validate_certs }}"
        api_version: v1
        kind: Pod
        namespace: "{{ _tenant_user }}-parasol-payments"
      register: r_payments_pods

    # -----------------------------------------------------------------
    # Summary
    # -----------------------------------------------------------------
    - name: "E2E Module 4 — Load Test Summary"
      ansible.builtin.debug:
        msg: >-
          Load test complete for {{ _tenant_user }}:
          parasol-web hits: {{ r_web_hits.results | default([]) | selectattr('failed', 'equalto', false) | list | length if r_web_hits is defined else 'skipped' }}/{{ _load_iterations }} |
          payments-api hits: {{ r_payments_hits.results | default([]) | selectattr('failed', 'equalto', false) | list | length if r_payments_hits is defined else 'skipped' }}/{{ _load_iterations }} |
          Web pods: {{ r_web_pods.resources | default([]) | length }} |
          Payments pods: {{ r_payments_pods.resources | default([]) | length }}

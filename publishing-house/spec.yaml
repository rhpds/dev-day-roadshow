# Publishing House — Project Spec
# Lifecycle: intake → content_review → infra_review → jira_sync → development → ready → published
# No secrets in this file. Tokens live in ~/.config/publishing-house/auth.json
# Stage is managed by SonataFlow and cached in .ph-state — do not edit stage.current manually.
# NOTE: This file is also in the template repo. The Scaffolder overlays project.* values.
# TODO: Eliminate this copy — Scaffolder should pull from template repo directly.

project:
  slug: "dev-day-roadshow"
  owner_email: "eshortis@redhat.com"
  content_type: "lab"
  deployment_mode: "rhdp_published"
  initiative_key: "rh1_2027"
  showroom_type: "classic"
  intake_type: "migration"
  automation_type: "both"
  description: "Focuses on improving developer output and efficiency with OpenShift's Application Platform capabilities. Attendees get hands-on experience with Dev Spaces with Agentic AI, GitOps, Pipelines, Developer Hub, Red Hat Application Foundations, and more."
  # content_reviewer_email and infra_reviewer_email are assigned by the RHDP team — not set by the author
  jira_ticket: "RHDPCD-1116"
  workflow_id: "cdcb57a4-5a1b-487c-b371-2a20218bcd27"

spec:
  title: "OpenShift Dev Day Roadshow"
  learning_objectives:
    - "Explore the Red Hat Developer Hub software catalog and navigate application components using the Lightspeed AI assistant"
    - "Create a cloud development environment using a self-service golden path template in Red Hat Developer Hub"
    - "Build a new REST API endpoint in a Java/Quarkus application using Red Hat OpenShift Dev Spaces"
    - "Analyze CI/CD pipeline results and diagnose code quality failures reported by SonarQube"
    - "Implement AI-assisted code quality fixes using the Zoo Code coding assistant to remediate code smells"
    - "Deploy a feature to production by merging changes in GitLab and approving GitOps manifests in Red Hat OpenShift GitOps"
  modules:              # [{id, title, duration_min}] — written by intake Phase 4; id is stable (e.g. module-01)
    - {id: module-01, title: "Explore the Platform", duration_min: 20, status: not_started}
    - {id: module-02, title: "Develop a Feature", duration_min: 25, status: not_started}
    - {id: module-03, title: "CI/CD Pipeline & Quality Gates", duration_min: 15, status: not_started}
    - {id: module-04, title: "AI-Assisted Code Fix", duration_min: 10, status: not_started}
    - {id: module-05, title: "GitOps Promotion & Production Deploy", duration_min: 15, status: not_started}
  environment:
    platform: "ocp"            # ocp | rhel-vms — determines which sizing fields apply
    topology: "shared-cluster" # shared-cluster | per-student | cnv-pool
    cloud_provider: cnv        # cnv | aws | troshka — cnv is default
    max_concurrent_users: null # required if topology = shared-cluster

    # --- OCP-specific fields (only when platform = ocp) ---
    ocp_version: "4.20"                # e.g. 4.20 — minimum 4.20; leave empty for rhel-vms
    cluster_type: "multinode"          # sno | multinode — only for platform = ocp
    control_plane_instance_count: null # 1 if sno, 3 if multinode
    control_plane_cpu: null            # 32 if sno, 16 if multinode
    control_plane_ram_gb: null         # 128 if sno, 64 if multinode
    worker_count: null                 # number of OCP worker nodes
    worker_cpu: null                   # vCPU per worker
    worker_ram_gb: null                # RAM per worker in GB
    worker_disk_gb: null               # disk per worker in GB

    # --- VM-specific fields (only when platform = rhel-vms) ---
    # Each entry: {role, count, cpu, ram_gb, disk_gb, os}
    vms_per_student: []

    # --- Common fields (both platforms) ---
    aap_version: ""                    # required if AAP in products
    ai_requirement: "maas"             # maas | gpu | none
    ai_model_tier: "open-source"       # open-source | frontier (if ai_requirement = maas or gpu)
    ai_model_name: "qwen3-235b"        # specific model e.g. granite-3.1-8b
    ai_justification: ""               # required if ai_model_tier = frontier or ai_requirement = gpu
    non_ga_products: []                # list of non-GA products/versions
    non_ga_access_plan: ""             # how access is provided for non-GA products
    external_services: []              # named external service dependencies e.g. [github.com]
    gpu_nodes: 0                       # number of GPU nodes (0 = none)
    gpu_type: ""                       # e.g. NVIDIA A100 40GB (required if gpu_nodes > 0)
  duration_hours: 1.5
  audience: "intermediate"   # beginner | intermediate | advanced

development:
  automation:
    gitops:
      status: not_started
    ansible:
      status: not_started
  e2e:
    status: not_started
  healthCheck:
    status: not_started

compliance:
  last_hard_check: null
  hard_result: null

tracking:
  paused: false
  pause_reason: null

# Approval checklist — filled collaboratively by author + skill + system + reviewers
approval_checklist:

  content:
    prerequisites_verifiable: false
    assessment_strategy: ""
    catalog_gap: "This is the canonical Dev Day Roadshow workshop for the RH1 2027 initiative, migrated from published.ocp-dev-days-rdshw.prod. It fills a gap for short-format, event-delivery workshops covering the full developer inner+outer loop with no prerequisites, browser-only delivery, and an AI-first approach. It is designed to grow modularly (secure supply chain, App Foundation, Connectivity Link planned) — a format not covered by the longer, prerequisite-heavy alternatives in the catalog."
    design_overview: "OpenShift Dev Day Roadshow is a modular, hands-on workshop delivered as part of Red Hat's Dev Day event series, guiding participants through a complete developer journey on the OpenShift application platform. Using a fictional Parasol Insurance scenario, participants explore Red Hat Developer Hub, develop a REST API feature in Dev Spaces, run CI/CD pipelines with quality gates, fix code smells with AI assistance, and deploy to production via GitOps. Additional modules covering secure software supply chain, Red Hat Application Foundation, and Red Hat Connectivity Link are planned."
    module_summaries:
      - title: "Explore the Platform"
        overview: "Participants discover the Parasol Insurance scenario, navigate Red Hat Developer Hub's software catalog, and interact with the Lightspeed AI assistant. They then use a self-service golden path template to create a personal cloud development environment."
      - title: "Develop a Feature"
        overview: "Participants open Red Hat OpenShift Dev Spaces, run the Parasol application in development mode, and implement a new claims statistics REST endpoint in Java/Quarkus."
      - title: "CI/CD Pipeline & Quality Gates"
        overview: "Participants push their code changes and observe an OpenShift Pipeline execute end-to-end, including a SonarQube quality gate that intentionally fails due to code smells — illustrating the importance of automated quality enforcement."
      - title: "AI-Assisted Code Fix"
        overview: "Participants use the Zoo Code AI coding assistant to identify and fix the code smells flagged by SonarQube, then verify that the CI/CD pipeline passes."
      - title: "GitOps Promotion & Production Deploy"
        overview: "Participants merge the feature branch in GitLab, create a release tag, approve GitOps manifests in Argo CD, and verify that the new REST endpoint is live in the production namespace."
    rcars_overlap_pct: 93
    rcars_top_matches:
      - title: "Unlocking OpenShift's Full Value"
        ci_name: "published.ocp-app-platform-roi.prod"
        url: "https://catalog.demo.redhat.com/catalog?item=published.ocp-app-platform-roi.prod"
        relevance_score: 93
        why_it_fits: "Covers all four core technologies — Developer Hub, Dev Spaces, Pipelines, GitOps — with the same Parasol Insurance narrative and developer journey arc."
      - title: "OpenShift Advanced App Platform Demo"
        ci_name: "published.ocp4-adv-app-platform-demo.prod"
        url: "https://catalog.demo.redhat.com/catalog?item=published.ocp4-adv-app-platform-demo.prod"
        relevance_score: 78
        why_it_fits: "Covers Developer Hub with Lightspeed, Dev Spaces, Pipelines, and GitOps/Argo CD in the same technology set."
      - title: "Service Enablement: App Platform Software Factory"
        ci_name: "openshift-cnv.app-platform-factory-cnv.prod"
        url: "https://catalog.demo.redhat.com/catalog?item=openshift-cnv.app-platform-factory-cnv.prod"
        relevance_score: 77
        why_it_fits: "Covers Developer Hub (golden path templates), Dev Spaces, Pipelines, and GitOps — same four technology pillars."
        workloads:
          - role: "ocp4_workload_authentication"
            collection: "agnosticd.core_workloads"
          - role: "ocp4_workload_gitops_bootstrap"
            collection: "agnosticd.core_workloads"
          - role: "ocp4_workload_openshift_gitops"
            collection: "agnosticd.core_workloads"
          - role: "ocp4_workload_showroom"
            collection: "agnosticd.showroom"
    rejections: []

  infra:
    peak_environments: null
    cost_per_run_est: ""
    provisioning_time_est: ""
    agnosticv_base_ci: ""
    approved_by: ""
    rejections: []
